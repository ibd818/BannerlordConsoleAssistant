name: Build Windows EXE

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run core tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p 'test_core.py' -v

      - name: Build Windows EXE
        shell: pwsh
        run: .\build.ps1 -Python python

      - name: Verify build output
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "outputs\BannerlordConsoleAssistant.exe"
          if (-not (Test-Path $output -PathType Leaf)) {
            throw "Expected build output was not found: $output"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: BannerlordConsoleAssistant-windows
          path: outputs/BannerlordConsoleAssistant.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
